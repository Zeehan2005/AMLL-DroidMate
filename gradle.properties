# ============================================================================
# Gradle 构建属性配置文件
# ============================================================================
#
# **文件作用**：
# gradle.properties 用于配置 Gradle 构建的各种属性和性能优化选项。
# 这些设置会影响整个项目的编译速度、内存使用和构建行为。
#
# **主要功能**：
# 1. JVM 参数配置（堆内存大小）
# 2. 并行构建优化
# 3. Android 特定配置
# 4. Kotlin 编译器设置
# 5. R8 代码压缩优化
#
# **性能影响**：
# - 合理配置可提升 30-50% 的构建速度
# - 减少内存溢出错误
# ============================================================================
# ============================================================================
# ==================== JVM 参数配置 ====================
# Gradle 守护进程的最大堆内存大小
# -Xmx2048m: 最大 2GB 内存（根据项目复杂度调整，大型项目建议 4096m）
org.gradle.jvmargs=-Xmx2048m

# ==================== 并行构建优化 ====================
org.gradle.parallel=true
# ==================== Android 基础配置 ====================
# ==================== Android 基础配置 ====================
# 使用 AndroidX 支持库（Android 官方推荐）
android.useAndroidX=true

# 禁用 Jetifier：不自动迁移第三方库到 AndroidX
# false: 提升构建速度（Jetifier 会拖慢构建）
# 前提：所有依赖都已使用 AndroidX
android.enableJetifier=false
# ==================== Kotlin 编译器配置 ====================
# 启用增量编译：只编译修改过的 Kotlin 文件
kotlin.incremental=true

# 禁用 Kotlin 统计信息收集（轻微提升性能）
org.jetbrains.kotlin.gradle.plugin.statistics=false

# ==================== Gradle 配置缓存 ====================
# 启用配置缓存：重用任务配置（大幅提升后续构建速度）
# 注意：AGP 9.2.1 的 ProcessNavigationXmlTask 存在已知问题：
# __runtimeDependenciesNavigationFiles__ 字段包含不可缓存的
# ResolutionBackedFileCollectionSpec(ArrayList) 类型，会导致报错：
#   "Configuration cache state could not be cached: field `elements` of ...
#    found in field `__runtimeDependenciesNavigationFiles__` of task
#    `:app:processDebugNavigationResources` ... error writing value of type
#    'java.util.ArrayList'"
# 如果遇到此问题，设为 false 即可禁用配置缓存
org.gradle.configuration-cache=true

# ==================== Android 高级配置 ====================
# 允许唯一的包名（避免命名冲突）
android.uniquePackageNames=false

# 使用约束管理依赖版本（更灵活的版本控制）
android.dependency.useConstraints=true

# 当库使用约束时不生成同步问题（减少 IDE 警告）
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false

# R8 严格模式：禁用严格的 keep 规则检查
# false: 允许更灵活的 ProGuard 规则
android.r8.strictFullModeForKeepRules=false

# ==================== R8 代码压缩和资源优化 ====================
# 启用 R8 完全模式：更激进的代码压缩和优化
# true: 减小 APK 体积，但可能增加构建时间
android.enableR8.fullMode=true

# 启用资源优化：移除未使用的资源文件
# true: 减小 APK 体积，提升运行时性能
android.enableResourceOptimizations=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
